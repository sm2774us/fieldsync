[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldsync"
version = "1.0.0"
description = "Offline-first device sync: durable, ordered, idempotent, auditable (reference implementation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "cryptography>=43",
  "pydantic>=2.8",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
fieldsync-admin = "fieldsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.report]
fail_under = 88
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "S104", "RUF012", "RUF028", "RUF059", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "RUF015", "C416"]
"evals/*" = ["S101"]
"src/fieldsync/device.py" = ["S311"]
"src/fieldsync/triage.py" = ["C416"]
"src/fieldsync/simulate.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional dependency whose typing differs across mcp versions; covered by a test when installed.
module = "fieldsync.mcp_server"
ignore_errors = true
